# The commit gate, run on every push and pull request.
#
# The matrix is wide on purpose. ccledger writes to `~/.claude/settings.json` on
# a teammate's own machine and opens a native SQLite build, and both of those
# are where cross-platform bugs actually live — a path joined with the wrong
# separator, a file rewritten with the wrong line endings, a prebuilt binary
# that exists for one platform and not another. None of it is visible on Linux
# alone.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others pass; that
      # difference is usually the diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22 is the floor `engines` declares and 24 is the current LTS. Not 20:
        # better-sqlite3 requires >=22 and does not merely warn about it — the
        # addon segfaults on opening a database — and Node 20 left support in
        # April 2026.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # better-sqlite3 is a native addon and Windows is the one leg of the
      # matrix that compiles it. The node-gyp npm ships with on Node 22 —
      # 11.5.0 — cannot identify Visual Studio 18, the only toolchain on the
      # current windows-latest image: its PowerShell probe overruns the child
      # process buffer, and the path scan it falls back to reports "unknown
      # version undefined". It then concludes there is no compiler at all and
      # `npm ci` fails before a single test runs.
      #
      # Node 24 passes on the same image because the npm it ships with carries
      # a newer node-gyp, so this brings Node 22 up to the same one. Installing
      # node-gyp separately does not work: npm resolves its own bundled copy
      # and ignores both `npm config set node_gyp`, which it rejects as an
      # invalid option, and the `npm_config_node_gyp` environment variable.
      - name: Update npm, whose node-gyp has to recognise Visual Studio 18
        if: runner.os == 'Windows'
        run: npm install -g npm@latest

      # `ci`, not `install`: the lockfile decides, and a resolution that drifts
      # between a developer's machine and this one is itself a failure.
      - run: npm ci

      # First, because it is the fastest way to fail and the most likely thing
      # to differ per platform. Prettier is configured `endOfLine: "lf"`, so a
      # Windows checkout without the `.gitattributes` rule fails right here
      # rather than somewhere confusing later.
      - run: npm run format:check

      - run: npm run lint

      # Both halves: `src/` plus `test/` against the root config, and `web/`
      # against its own.
      - run: npm run typecheck

      - run: npm test

      # Last because it is the slowest, and because a build that fails after
      # green tests is a packaging problem rather than a code one.
      - run: npm run build

  package:
    # What `npm publish` would actually upload. Separate from the matrix because
    # the tarball's contents do not vary by platform, and one job answering the
    # question is enough.
    name: tarball contents
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Asserts the dashboard, the schema files and the entry point are all in
      # the tarball, and that nothing private is. Every one of those failures is
      # silent at install time and only shows up on a user's first run.
      - run: npm run verify:package
